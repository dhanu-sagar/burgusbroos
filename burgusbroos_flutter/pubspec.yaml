name: burgusbroos_flutter
description: "A cross-platform personal productivity app built on tiny compounding actions, featuring Simple & Advanced modes, 3-bucket task triage, live focus sprints, and Supabase cloud sync."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.252.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
